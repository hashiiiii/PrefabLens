name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (X.Y.Z, no v prefix)'
        required: true
      skip_chrome_extension:
        description: 'Skip Chrome Web Store publish (GitHub Release still includes the extension zip)'
        type: boolean
        default: false

permissions:
  contents: write

# Prevent overlapping runs of release.yml
concurrency:
  group: release

jobs:
  # The CLI compiles its version out of build.zig.zon, so the bump must
  # precede the builds. The commit/tag/push happens in the release job
  # after every artifact exists, so a failed build leaves nothing on origin.
  prepare:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Install tools
        uses: jdx/mise-action@v4
      - name: Validate input
        run: |
          set -euo pipefail
          [ "$GITHUB_REF_NAME" = "main" ] || { echo "::error::run this workflow from main (got $GITHUB_REF_NAME)"; exit 1; }
      - name: Bump version
        run: |
          set -euo pipefail
          bump-my-version bump --new-version "$VERSION"
          git add -u
          git diff --cached --name-only -z | tar --null -T - -czf "$RUNNER_TEMP/version-bump.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: version-bump
          path: ${{ runner.temp }}/version-bump.tar.gz
          if-no-files-found: error
          retention-days: 1

  cli:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: aarch64-macos
            asset: macos-arm64
            binary: prefablens
          - target: x86_64-macos
            asset: macos-x64
            binary: prefablens
          - target: x86_64-linux-gnu
            asset: linux-x64
            binary: prefablens
          - target: aarch64-linux-gnu
            asset: linux-arm64
            binary: prefablens
          - target: x86_64-windows
            asset: windows-x64
            binary: prefablens.exe
          - target: aarch64-windows
            asset: windows-arm64
            binary: prefablens.exe
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/apply-version-bump
      - uses: jdx/mise-action@v4
      - uses: ./.github/actions/setup-zig-cache
      - name: Build CLI
        run: |
          set -euo pipefail
          mkdir -p dist
          zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSafe
          (cd zig-out/bin && zip -j "../../dist/prefablens-${{ matrix.asset }}.zip" "${{ matrix.binary }}" git-merge-prefablens)
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.asset }}
          path: dist/prefablens-${{ matrix.asset }}.zip
          if-no-files-found: error
          retention-days: 1

  extension:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/apply-version-bump
      - uses: jdx/mise-action@v4
      - uses: ./.github/actions/setup-zig-cache
      - uses: ./.github/actions/setup-pnpm-store
      - name: Build and package extension
        run: |
          set -euo pipefail
          mkdir -p dist
          zig build wasm
          pnpm -C extension install --frozen-lockfile
          pnpm -C extension build
          # Zip the dist contents (not the directory) so manifest.json sits at the zip root
          (cd extension/dist && zip -r "../../dist/prefablens-extension-$VERSION.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: dist/prefablens-extension-${{ inputs.version }}.zip
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [cli, extension]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
      - uses: ./.github/actions/apply-version-bump
      - name: Stage version bump
        run: |
          set -euo pipefail
          # Stage the bump now so downloaded zips cannot leak into the commit.
          git add -u
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: extension
          path: dist
      - name: Commit, tag, and push
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          # Author the commit as the app; the +<id> email links it to the bot account.
          user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git diff --cached --quiet || git commit -m "chore: release v$VERSION"
          git tag "v$VERSION"
          git push --atomic origin main "v$VERSION"
      - name: Create release
        env:
          # Publish as the App so the release isn't attributed to github-actions[bot].
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          # Package tools use SHA256SUMS to validate assets without downloading them.
          (cd dist && shasum -a 256 *.zip > SHA256SUMS)
          gh release create "v$VERSION" dist/* --generate-notes

  # Render package files from the published release. This job is safe to run
  # again because it skips each repository when its package file is unchanged.
  publish-packages:
    needs: release
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: hashiiiii
          repositories: PrefabLens,homebrew-tap,scoop-bucket
      - uses: actions/checkout@v7
      - name: Render package files from the published release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          gh release download "v$VERSION" --dir dist
          cli/pkg/render.sh "$VERSION" dist out
      - name: Push package files
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          # publish <repo> <src> <dest>: commit the rendered formula to the
          # tap repo, skipping the push when nothing changed (re-runs).
          publish() {
            git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/hashiiiii/$1.git" "repos/$1"
            mkdir -p "repos/$1/$(dirname "$3")"
            cp "$2" "repos/$1/$3"
            git -C "repos/$1" config user.name "${APP_SLUG}[bot]"
            git -C "repos/$1" config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
            git -C "repos/$1" add "$3"
            git -C "repos/$1" diff --cached --quiet || {
              git -C "repos/$1" commit -m "chore: prefablens v$VERSION"
              git -C "repos/$1" push
            }
          }
          publish homebrew-tap out/prefablens.rb Formula/prefablens.rb
          publish scoop-bucket out/prefablens.json bucket/prefablens.json

  # Uploads the extension zip from the published release to the Chrome Web
  # Store and submits it for review; the store publishes it automatically on
  # approval. Independent from the release: safe to re-run in isolation, but
  # fails while a previous submission is still pending review.
  # Skipped when skip_chrome_extension is true. The release still attaches
  # the zip, so this job can run later on its own.
  publish-extension:
    if: ${{ !inputs.skip_chrome_extension }}
    needs: release
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Download extension zip from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --pattern "prefablens-extension-*.zip" --dir dist
      - name: Upload and submit for review
        env:
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          token=$(curl -fsS https://oauth2.googleapis.com/token \
            -d client_id="$CWS_CLIENT_ID" -d client_secret="$CWS_CLIENT_SECRET" \
            -d refresh_token="$CWS_REFRESH_TOKEN" -d grant_type=refresh_token | jq -er .access_token)
          # cws <curl args...>: call the API, log the response, and pass it to the jq assertion
          cws() { curl -fsS -H "Authorization: Bearer $token" -H "x-goog-api-version: 2" "$@" | tee /dev/stderr; }
          cws -X PUT -T "dist/prefablens-extension-$VERSION.zip" \
            "https://www.googleapis.com/upload/chromewebstore/v1.1/items/$CWS_EXTENSION_ID" \
            | jq -e '.uploadState == "SUCCESS"' >/dev/null
          cws -X POST -H "Content-Length: 0" \
            "https://www.googleapis.com/chromewebstore/v1.1/items/$CWS_EXTENSION_ID/publish" \
            | jq -e '.status == ["OK"]' >/dev/null
