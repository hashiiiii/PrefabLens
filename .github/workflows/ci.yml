name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One run per ref at a time; a superseded push cancels the in-flight run
# instead of queueing a redundant full matrix behind it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Version sync guard
        if: matrix.os == 'ubuntu-latest'
        run: .github/scripts/check-version-sync.sh
      - name: Install tools
        uses: jdx/mise-action@v4
      - name: Restore Zig global cache
        # Windows Zig caching was measured as not worth it (see PR #36 context)
        if: matrix.os == 'ubuntu-latest'
        uses: ./.github/actions/setup-zig-cache
      - name: Lint
        run: zig build lint
      - name: Test
        run: zig build test --summary all
      - name: Performance budget
        # Windows runners are too noisy; the measurements swing too much, so skip them here
        if: matrix.os == 'ubuntu-latest'
        run: zig build perf

  release-builds:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - aarch64-macos
          - x86_64-macos
          - x86_64-linux-gnu
          - aarch64-linux-gnu
          - x86_64-windows
          - aarch64-windows
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - uses: ./.github/actions/setup-zig-cache
      - run: zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSafe

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install tools
        uses: jdx/mise-action@v4
      - name: Restore Zig global cache
        uses: ./.github/actions/setup-zig-cache
      - name: Restore pnpm store cache
        uses: ./.github/actions/setup-pnpm-store
      - name: Resolve Playwright version
        id: playwright-version
        run: |
          version=$(grep -oE '@playwright/test@[0-9]+\.[0-9]+\.[0-9]+' extension/pnpm-lock.yaml | head -n 1 | cut -d '@' -f 3)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Restore Playwright browser cache
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
      - name: WASM build and golden
        run: |
          zig build wasm
          node --test core/tests/*.test.mjs
      - name: Extension checks
        working-directory: extension
        run: |
          pnpm install --frozen-lockfile
          pnpm run size
          pnpm run lint
          pnpm run typecheck
          pnpm test
          pnpm run build
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: extension
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Playwright OS dependencies
        # A cache hit restores the browser binaries but not the runner's OS
        # packages; the E2E launches full Chromium (channel "chromium" with
        # the extension loaded), so the shared libraries must still exist.
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: extension
        run: pnpm exec playwright install-deps chromium
      - name: Extension E2E
        working-directory: extension
        run: pnpm run e2e

  editor_native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install tools
        uses: jdx/mise-action@v4
      - name: Restore NuGet package cache
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('editor/**/*.csproj', 'editor/.config/dotnet-tools.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      - name: Build real CLI test bundles
        run: zig build test-installation-binaries -Doptimize=ReleaseSafe
      - name: Packaging render test
        if: matrix.os != 'windows-latest'
        run: cli/pkg/render_test.sh zig-out/bin
      - name: Lint
        working-directory: editor
        run: |
          dotnet tool restore
          dotnet csharpier check . --no-msbuild-check
      - name: Test
        working-directory: editor
        run: dotnet test DotNetTests~/Tests
        env:
          PREFABLENS_TEST_BIN_DIR: ${{ github.workspace }}/zig-out/bin
          PREFABLENS_TEST_ALT_BIN_DIR: ${{ github.workspace }}/zig-out/test-alternate-bin

  editor:
    # Branch protection requires this name. All native editor runs must pass.
    needs: editor_native
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "$EDITOR_RESULT" = success
        env:
          EDITOR_RESULT: ${{ needs.editor_native.result }}

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build site inputs
        uses: ./.github/actions/build-site
      - name: Site checks
        working-directory: site
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
