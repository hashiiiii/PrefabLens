[tool.bumpversion]
current_version = "0.12.0"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
search = "{current_version}"
replace = "{new_version}"
commit = false
tag = false
allow_dirty = true

[[tool.bumpversion.files]]
filename = "build.zig.zon"
search = '.version = "{current_version}"'
replace = '.version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "extension/manifest.json"
search = '"version": "{current_version}"'
replace = '"version": "{new_version}"'

[[tool.bumpversion.files]]
filename = "editor/package.json"
search = '"version": "{current_version}"'
replace = '"version": "{new_version}"'

[[tool.bumpversion.files]]
filename = "editor/Editor/Cli.cs"
search = 'public const string Version = "{current_version}"'
replace = 'public const string Version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "extension/package.json"
search = '"version": "{current_version}"'
replace = '"version": "{new_version}"'

[[tool.bumpversion.files]]
filename = "README.md"
search = 'https://github.com/hashiiiii/PrefabLens.git?path=editor#v{current_version}'
replace = 'https://github.com/hashiiiii/PrefabLens.git?path=editor#v{new_version}'

[[tool.bumpversion.files]]
filename = "docs/editor.md"
search = 'https://github.com/hashiiiii/PrefabLens.git?path=editor#v{current_version}'
replace = 'https://github.com/hashiiiii/PrefabLens.git?path=editor#v{new_version}'

[[tool.bumpversion.files]]
filename = "docs/cli.md"
search = 'https://github.com/hashiiiii/PrefabLens/blob/v{current_version}/docs/cli.md'
replace = 'https://github.com/hashiiiii/PrefabLens/blob/v{new_version}/docs/cli.md'

[[tool.bumpversion.files]]
filename = "site/index.liquid"
search = 'https://github.com/hashiiiii/PrefabLens.git?path=editor#v{current_version}'
replace = 'https://github.com/hashiiiii/PrefabLens.git?path=editor#v{new_version}'

[[tool.bumpversion.files]]
filename = "site/editor.liquid"
search = 'https://github.com/hashiiiii/PrefabLens.git?path=editor#v{current_version}'
replace = 'https://github.com/hashiiiii/PrefabLens.git?path=editor#v{new_version}'
